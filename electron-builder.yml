appId: app.cockpit.desktop
productName: Cockpit
copyright: Laurens Bos
directories:
  output: release/dist
  buildResources: resources
# The window only needs the compiled shell; the server ships as a resource with its own node_modules.
files:
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: release/server
    to: server
asar: true
npmRebuild: false
win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Cockpit
portable:
  artifactName: ${productName}-${version}-portable.${ext}
