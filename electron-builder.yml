appId: app.cockpit.desktop
productName: Cockpit
copyright: Laurens Bos
directories:
  output: release/dist
  buildResources: resources
# The window only needs the compiled shell; the server ships as a resource with its own node_modules.
files:
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  # electron-builder always drops a node_modules folder at the top of `from`, so copy from one level up.
  - from: release
    to: .
    filter:
      - "server/**/*"
asar: true
npmRebuild: false
win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Cockpit
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: resources/icon.icns
  # Ad-hoc signed: no Apple developer account. Without notarization the hardened runtime adds
  # nothing, and with it an ad-hoc signed Electron would need extra entitlements.
  identity: "-"
  hardenedRuntime: false
  # Without this sentence macOS silently refuses to let the app open Terminal for Claude Code.
  extendInfo:
    NSAppleEventsUsageDescription: Cockpit opent Terminal om Claude Code te starten met de taak die je kiest.
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# Only for the smoke test of the packaged layout on Linux.
linux:
  target: dir
