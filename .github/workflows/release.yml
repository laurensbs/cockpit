name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the Mac app (dmg and zip, Apple Silicon and Intel)
        run: npm run electron:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start the packaged app and open the cockpit
        run: |
          APP=$(ls -d release/dist/mac-arm64/Cockpit.app 2>/dev/null || ls -d release/dist/mac*/Cockpit.app | head -1)
          COCKPIT_PACKAGED_APP="$PWD/$APP/Contents/MacOS/Cockpit" npm run test:electron
      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-mac
          path: |
            release/dist/*.dmg
            release/dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the app and the installer
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start the packaged app and open the cockpit
        run: npm run test:electron
        env:
          COCKPIT_PACKAGED_APP: ${{ github.workspace }}\release\dist\win-unpacked\Cockpit.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-windows
          path: release/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cockpit-mac/*
            dist/Cockpit-windows/*
