name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the Mac app (dmg and zip, Apple Silicon and Intel)
        run: npm run electron:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start the packaged app and open the cockpit
        run: |
          APP=$(ls -d release/dist/mac-arm64/Cockpit.app 2>/dev/null || ls -d release/dist/mac*/Cockpit.app | head -1)
          COCKPIT_PACKAGED_APP="$PWD/$APP/Contents/MacOS/Cockpit" npm run test:electron
      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-mac
          path: |
            release/dist/*.dmg
            release/dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the app and the installer
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Start the packaged app and open the cockpit
        run: npm run test:electron
        env:
          COCKPIT_PACKAGED_APP: ${{ github.workspace }}\release\dist\win-unpacked\Cockpit.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-windows
          path: release/dist/*.exe
          if-no-files-found: error

  # Every build of main publishes the release for the version in package.json (a tag v* publishes
  # that tag). An existing release of the same version gets the new files; bump the version for a
  # new release.
  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cockpit ${{ steps.version.outputs.tag }}
          files: |
            dist/Cockpit-mac/*
            dist/Cockpit-windows/*
